name: AKS Upgrade

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: "Azure subscription ID"
        required: true
      target_version:
        description: "Target Kubernetes version (e.g. 1.29.7)"
        required: true
      resource_group:
        description: "Resource Group of the AKS cluster"
        required: true
      cluster_name:
        description: "AKS Cluster name"
        required: true

jobs:
  aks-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          az extension add --name aks-preview || true

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run AKS upgrade script
        env:
          AZ_SUBSCRIPTION: ${{ github.event.inputs.subscription_id }}
          TARGET_VERSION: ${{ github.event.inputs.target_version }}
          RESOURCE_GROUP: ${{ github.event.inputs.resource_group }}
          CLUSTER_NAME: ${{ github.event.inputs.cluster_name }}
        run: |
          python aks_upgrade.py --output-dir backups
